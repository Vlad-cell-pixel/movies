# Як запускати контейнер на сервері:  docker compose up -d --build
services:
  api:
    build: .
    restart: always              # перезапуск після падіння і після перезавантаження сервера
    env_file: .env               # SECRET_KEY з файлу .env (він не в git і не в образі)
    ports:
      - "127.0.0.1:8000:8000"    # лише для nginx на цьому ж сервері, ззовні не видно
    volumes:
      - ./data:/data             # база в папці ~/movies/data, переживає перезбирання контейнера
