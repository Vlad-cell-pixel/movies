# Адмінка лише з приватної мережі Tailscale (адреси 100.64.0.0/10).
# Звертатися за адресою сервера в Tailscale: http://100.x.y.z/admin/...
server {
    listen 80 default_server;
    server_name _;

    location /admin/ {
        allow 100.64.0.0/10;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
